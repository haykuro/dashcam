<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Dashcam SEI Explorer</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --bg-panel: #f5f5f5;
            --text: #1a1a1a;
            --text-muted: #666666;
            --accent: #0080ff;
            --accent-hover: #0099ff;
            --border: #888888;
            --drop-hover-bg: #e8f4ff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --bg-panel: #252525;
                --text: #e8e8e8;
                --text-muted: #999999;
                --accent: rgb(255, 0, 51);
                --accent-hover: rgb(200, 0, 40);
                --border: #666666;
                --drop-hover-bg: #291818;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.4;
        }

        a {
            color: var(--accent);
        }

        /* ===== APP SHELL ===== */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 1rem;
            gap: 0.75rem;
        }

        /* Header - fixed height */
        .header {
            flex-shrink: 0;
        }

        .header .nav {
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }

        .header h1 {
            font-size: 1.4rem;
            margin-bottom: 0.125rem;
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Main content - fills remaining space */
        .main {
            flex: 1;
            min-height: 0;
            /* Critical for flex children to shrink */
            display: flex;
            gap: 1rem;
        }

        /* ===== COLUMN LAYOUT (default: wide screens) ===== */
        /* Left: Video + Controls */
        .video-section {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Right: Metadata + Export */
        .meta-section {
            width: 285px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* ===== FILE LIST PANEL ===== */
        .file-panel {
            flex-shrink: 0;
            background: var(--bg-panel);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 40%;
        }

        .file-panel-header {
            padding: 0.4rem 0.75rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-panel-header span {
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }

        .file-clear-btn {
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            cursor: pointer;
            padding: 0;
        }

        .file-clear-btn:hover {
            color: var(--accent);
        }

        .file-list {
            padding: 0.25rem 0;
            overflow-y: auto;
        }

        .file-item {
            width: 100%;
            text-align: left;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .file-item.file-item-child {
            padding-left: 1.5rem;
            font-size: 0.72rem;
        }

        .file-item-main {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item-sub {
            font-size: 0.65rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            .file-item:hover {
                background: rgba(255, 255, 255, 0.04);
            }
        }

        .file-item.active {
            background: rgba(0, 128, 255, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            .file-item.active {
                background: rgba(255, 0, 51, 0.16);
            }
        }

        /* ===== VIDEO AREA ===== */
        .video-wrap {
            flex: 1;
            min-height: 0;
            background: #000;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-wrap canvas {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        .video-grid {
            position: absolute;
            inset: 0;
            padding: 4px;
            box-sizing: border-box;
            gap: 4px;
            display: none;
            pointer-events: none;
        }

        .video-grid.active {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: 1fr;
        }

        .video-grid canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            border-radius: 4px;
        }

        /* Drop overlay */
        .drop-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-panel);
            border: 2px dashed var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .drop-overlay.hidden {
            display: none;
        }

        .drop-overlay:hover,
        .drop-overlay.dragover {
            background: var(--drop-hover-bg);
            border-color: var(--accent);
        }

        .drop-overlay p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .drop-overlay input {
            display: none;
        }

        /* ===== SCRUBBER ===== */
        .scrubber {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: var(--bg-panel);
            border-radius: 6px;
            height: 44px;
        }

        .scrubber button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, opacity 0.15s;
        }

        .scrubber button:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .scrubber button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .scrubber button svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .scrubber input[type="range"] {
            flex: 1;
            height: 4px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            padding: 12px 0;
            margin: -12px 0;
        }

        .scrubber input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
        }

        .scrubber input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            margin-top: -5px;
            cursor: pointer;
        }

        .scrubber input[type="range"]::-moz-range-track {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
        }

        .scrubber input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .scrubber input[type="range"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Thumbnail strip under scrubber */
        .thumb-strip {
            margin-top: 0.3rem;
            height: 60px;
            display: flex;
            align-items: center;
            gap: 3px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .thumb-strip canvas {
            flex: 0 0 auto;
            height: 100%;
            border-radius: 3px;
            background: #000;
        }

        .thumb-strip canvas:hover {
            outline: 2px solid var(--accent);
        }

        /* ===== METADATA PANEL ===== */
        .meta-panel {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            border-radius: 6px;
            overflow: hidden;
            padding-bottom: 3px;
        }

        .meta-header {
            flex-shrink: 0;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .meta-header .filename {
            font-weight: 600;
            font-size: 0.75rem;
            word-break: break-all;
        }

        .meta-header .framenum {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .meta-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
        }

        .meta-list .item {
            display: flex;
            flex-direction: column;
        }

        .meta-list .label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .meta-list .value {
            font-weight: 600;
            color: var(--accent);
        }

        /* Export button */
        .export-btn {
            flex-shrink: 0;
            height: 44px;
            padding: 0 0.75rem;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
        }

        .export-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .export-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== ROW LAYOUT (short/narrow screens) ===== */
        @media (max-height: 600px),
        (max-width: 600px) {
            .main {
                flex-direction: column;
            }

            .video-section {
                flex: none;
            }

            .video-wrap {
                flex: none;
                min-height: 200px;
                max-height: 40vh;
            }

            .meta-section {
                width: auto;
                flex: 1;
                min-height: 120px;
            }

            .meta-panel {
                flex: 1;
                min-height: 300px;
            }

            .meta-list {
                flex-direction: row;
                flex-wrap: wrap;
                /* gap: 0.5rem; */
            }

            .meta-list .item {
                min-width: 90px;
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="header">
            <p class="nav"><a href="index.html">← Back to Dashcam Tools</a></p>
            <h1>Tesla Dashcam SEI Explorer</h1>
            <p class="subtitle">View dashcam footage with embedded SEI metadata. All processing happens locally in your
                browser—no video/SEI data is uploaded. (<a
                    href="https://github.com/teslamotors/dashcam/blob/master/sei_explorer.html">view source</a>)</p>
        </header>

        <main class="main">
            <section class="video-section">
                <div class="video-wrap">
                    <div class="drop-overlay" id="dropOverlay">
                        <input type="file" id="fileInput" accept="video/mp4" multiple>
                        <p>Drop MP4 here or click to select</p>
                    </div>
                    <div class="video-grid" id="videoGrid"></div>
                    <canvas id="canvas"></canvas>
                </div>
                <div class="scrubber">
                    <button id="playBtn" title="Play/Pause" disabled>
                        <svg viewBox="0 0 24 24">
                            <polygon points="6,4 20,12 6,20" />
                        </svg>
                    </button>
                    <input type="range" id="slider" min="0" max="0" value="0" disabled>
                </div>
                <div class="thumb-strip" id="thumbStrip"></div>
            </section>

            <aside class="meta-section">
                <div class="file-panel">
                    <div class="file-panel-header">
                        <span>Files</span>
                        <button class="file-clear-btn" id="clearFilesBtn" type="button">Clear</button>
                    </div>
                    <div class="file-list" id="fileList"></div>
                </div>
                <div class="meta-panel">
                    <div class="meta-header">
                        <div class="filename" id="fileName">No file loaded</div>
                        <div class="framenum" id="frameNum">Frame 0/0</div>
                    </div>
                    <div class="meta-list" id="metaList"></div>
                </div>
                <button class="export-btn" id="exportBtn" disabled>Export CSV</button>
            </aside>
        </main>
    </div>

    <script src="vendor/protobuf.min.js"></script>
    <script src="vendor/jszip.min.js"></script>
    <script src="dashcam-mp4.js"></script>
    <script>
        // State
        let seiType = null, seiFields = null, seiFieldsCsv = null;
        let mp4 = null, frames = null, firstKeyframe = 0;
        let currentFileName = null;
        // loadedFiles: { key: string, sortKey: number | null, files: Array<{ file: File, camera: string | null }> }
        let loadedFiles = [];
        let currentFileIndex = -1;
        let currentCamera = null; // null = default (e.g. front) for that entry
        let decoder = null, decoding = false, pendingFrame = null;
        let playing = false, playTimer = null;
        let thumbnailsTaskId = 0;
        let currentMode = 'single'; // 'single' | 'grid'
        let gridCameras = []; // [{ camera, fileName, mp4, frames, firstKeyframe, config, canvas, ctx }]
        let lastGridFrameIndex = -1;
        let currentConfig = null;

        // DOM
        const $ = id => document.getElementById(id);
        const dropOverlay = $('dropOverlay'), fileInput = $('fileInput');
        const canvas = $('canvas'), ctx = canvas.getContext('2d');
        const slider = $('slider'), playBtn = $('playBtn'), exportBtn = $('exportBtn');
        const frameNum = $('frameNum'), fileName = $('fileName'), metaList = $('metaList');
        const thumbStrip = $('thumbStrip');
        const videoGrid = $('videoGrid');
        const videoWrap = document.querySelector('.video-wrap');
        const fileListEl = $('fileList'), clearFilesBtn = $('clearFilesBtn');

        // Helpers
        function parseRecordingDateFromName(name) {
            // Typical Tesla dashcam filename pattern: YYYY-MM-DD_HH-MM-SS-*.mp4
            const m = name.match(/(\d{4})-(\d{2})-(\d{2})[_T](\d{2})-(\d{2})-(\d{2})/);
            if (!m) return null;
            const [_, year, month, day, hour, min, sec] = m;
            const d = new Date(
                Number(year),
                Number(month) - 1,
                Number(day),
                Number(hour),
                Number(min),
                Number(sec)
            );
            return isNaN(d.getTime()) ? null : d;
        }

        function formatRecordingLabel(entry) {
            if (!entry.sortKey) return null;
            const d = new Date(entry.sortKey);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const hh = String(d.getHours()).padStart(2, '0');
            const mi = String(d.getMinutes()).padStart(2, '0');
            const ss = String(d.getSeconds()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
        }

        function parseCameraFromName(name) {
            // Expect suffix like "-front.mp4", "-back.mp4", "-left_repeater.mp4", etc.
            const m = name.match(/-([a-zA-Z_]+)\.mp4$/i);
            if (!m) return null;
            const raw = m[1].toLowerCase();
            if (raw.includes('front')) return 'front';
            if (raw.includes('back') || raw.includes('rear')) return 'back';
            if (raw.includes('left')) return 'left';
            if (raw.includes('right')) return 'right';
            return raw;
        }

        async function generateThumbnails() {
            thumbnailsTaskId++;
            const taskId = thumbnailsTaskId;
            thumbStrip.innerHTML = '';

            if (!mp4 || !frames || !frames.length) return;
            if (!('VideoDecoder' in window) || !('EncodedVideoChunk' in window)) return;

            const config = mp4.getConfig();
            const maxThumbs = Math.min(24, frames.length);
            const start = firstKeyframe >= 0 ? firstKeyframe : 0;
            const span = frames.length - start;
            if (span <= 0) return;

            const indices = [];
            for (let i = 0; i < maxThumbs; i++) {
                const t = i / (maxThumbs - 1 || 1);
                const idx = Math.min(frames.length - 1, start + Math.floor(t * (span - 1)));
                if (!indices.includes(idx)) indices.push(idx);
            }

            const thumbHeight = thumbStrip.clientHeight || 60;
            const thumbWidth = Math.round(thumbHeight * (config.width / config.height));

            for (const index of indices) {
                if (taskId !== thumbnailsTaskId) return;

                const c = document.createElement('canvas');
                c.width = thumbWidth;
                c.height = thumbHeight;
                c.dataset.index = String(index);
                c.title = `Frame ${index + 1}`;
                c.onclick = () => {
                    pause();
                    slider.value = index;
                    showFrame(index);
                };
                thumbStrip.appendChild(c);

                try {
                    await decodeFrameToCanvas(index, c.getContext('2d'), config);
                } catch {
                    // ignore thumbnail decode failures
                }
            }
        }

        async function decodeFrameToCanvas(index, targetCtx, config) {
            return new Promise((resolve, reject) => {
                let keyIdx = index;
                while (keyIdx >= 0 && !frames[keyIdx].keyframe) keyIdx--;
                if (keyIdx < 0) { resolve(); return; }

                let count = 0;
                const target = index - keyIdx + 1;

                const decoder = new VideoDecoder({
                    output: frame => {
                        try {
                            if (++count === target) {
                                targetCtx.drawImage(frame, 0, 0, targetCtx.canvas.width, targetCtx.canvas.height);
                            }
                        } finally {
                            frame.close();
                        }
                        if (count >= target) {
                            decoder.close();
                            resolve();
                        }
                    },
                    error: e => {
                        try { decoder.close(); } catch { }
                        reject(e);
                    }
                });

                decoder.configure({ codec: config.codec, width: config.width, height: config.height });
                for (let i = keyIdx; i <= index; i++) {
                    decoder.decode(createChunk(frames[i]));
                }
                decoder.flush().catch(err => {
                    try { decoder.close(); } catch { }
                    reject(err);
                });
            });
        }

        function updateGridScale() {
            if (!videoGrid.classList.contains('active') || !currentConfig || !videoWrap) {
                videoGrid.style.transform = '';
                return;
            }
            const wrapW = videoWrap.clientWidth;
            const wrapH = videoWrap.clientHeight;
            if (!wrapW || !wrapH) return;

            // Approximate grid height from width and video aspect ratio.
            const tileAspect = currentConfig.height / currentConfig.width || (9 / 16);
            const tileWidth = wrapW / 2;
            const idealTileHeight = tileWidth * tileAspect;
            const idealGridHeight = idealTileHeight * 2;

            const scale = Math.min(1, wrapH / idealGridHeight);
            videoGrid.style.transformOrigin = 'top center';
            videoGrid.style.transform = `scale(${scale})`;
        }

        // Events
        dropOverlay.onclick = () => fileInput.click();
        fileInput.onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
        document.ondragover = e => { e.preventDefault(); dropOverlay.classList.add('dragover'); };
        document.ondragleave = e => { if (!e.relatedTarget) dropOverlay.classList.remove('dragover'); };
        document.ondrop = async e => {
            e.preventDefault();
            dropOverlay.classList.remove('dragover');
            const items = e.dataTransfer?.items;
            if (items) {
                const { files, directoryName } = await DashcamHelpers.getFilesFromDataTransfer(items);
                handleFiles(files, directoryName);
            } else {
                handleFiles(e.dataTransfer?.files ?? []);
            }
        };
        window.addEventListener('resize', () => updateGridScale());
        slider.oninput = () => { pause(); showFrame(+slider.value); };
        playBtn.onclick = () => playing ? pause() : play();
        document.onkeydown = e => {
            if (!frames) return;
            if (e.key === ' ') {
                e.preventDefault(); playing ? pause() : play();
            } else if (e.key === 'ArrowLeft' && +slider.value > 0) {
                e.preventDefault(); pause(); slider.value = +slider.value - 1; showFrame(+slider.value);
            } else if (e.key === 'ArrowRight' && +slider.value < frames.length - 1) {
                e.preventDefault(); pause(); slider.value = +slider.value + 1; showFrame(+slider.value);
            }
        };
        exportBtn.onclick = exportCsv;
        clearFilesBtn.onclick = clearFiles;

        // Initialize protobuf
        DashcamHelpers.initProtobuf().then(({ SeiMetadata, enumFields }) => {
            seiType = SeiMetadata;
            seiFields = DashcamHelpers.deriveFieldInfo(SeiMetadata, enumFields, { useLabels: true });
            seiFieldsCsv = DashcamHelpers.deriveFieldInfo(SeiMetadata, enumFields, { useSnakeCase: true });
        }).catch(err => console.error('Protobuf init failed:', err));

        async function handleFiles(fileList, directoryName = null) {
            if (!seiType) await DashcamHelpers.initProtobuf().then(({ SeiMetadata, enumFields }) => {
                seiType = SeiMetadata;
                seiFields = DashcamHelpers.deriveFieldInfo(SeiMetadata, enumFields, { useLabels: true });
                seiFieldsCsv = DashcamHelpers.deriveFieldInfo(SeiMetadata, enumFields, { useSnakeCase: true });
            });

            const files = (Array.isArray(fileList) ? fileList : Array.from(fileList))
                .filter(f => f.name.toLowerCase().endsWith('.mp4'));
            if (!files.length) { alert('Please choose at least one MP4 file.'); return; }

            // Build/update event groups keyed by recording timestamp (or filename)
            const byKey = new Map(loadedFiles.map(entry => [entry.key, entry]));

            for (const file of files) {
                // Skip exact duplicates by name+size
                if (Array.from(byKey.values()).some(e => e.files.some(f => f.file.name === file.name && f.file.size === file.size))) {
                    continue;
                }

                const dt = parseRecordingDateFromName(file.name);
                const tsPartMatch = file.name.match(/(\d{4}-\d{2}-\d{2}[_T]\d{2}-\d{2}-\d{2})/);
                const key = tsPartMatch ? tsPartMatch[1] : file.name;
                const camera = parseCameraFromName(file.name);

                let entry = byKey.get(key);
                if (!entry) {
                    entry = {
                        key,
                        sortKey: dt ? dt.getTime() : null,
                        files: []
                    };
                    byKey.set(key, entry);
                }

                entry.files.push({ file, camera });
            }

            loadedFiles = Array.from(byKey.values());

            // Sort by recording time (newest first), unknown timestamps last by key
            loadedFiles.sort((a, b) => {
                if (a.sortKey && b.sortKey) return b.sortKey - a.sortKey;
                if (a.sortKey && !b.sortKey) return -1;
                if (!a.sortKey && b.sortKey) return 1;
                return a.key.localeCompare(b.key);
            });

            renderFileList();

            // If nothing loaded yet, automatically load the first item (newest event)
            if (currentFileIndex === -1 && loadedFiles.length) {
                selectFile(0, null);
            }
        }

        function renderFileList() {
            fileListEl.innerHTML = '';
            if (!loadedFiles.length) return;
            loadedFiles.forEach((entry, index) => {
                const hasTimestamp = !!entry.sortKey;
                const tsLabel = formatRecordingLabel(entry);

                // Parent event row (selects grid / default view)
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'file-item' + (index === currentFileIndex && currentCamera === null ? ' active' : '');

                const main = document.createElement('div');
                main.className = 'file-item-main';
                main.textContent = tsLabel || entry.key;

                const sub = document.createElement('div');
                sub.className = 'file-item-sub';
                const cameras = entry.files
                    .map(f => f.camera || 'clip')
                    .filter((v, i, a) => a.indexOf(v) === i)
                    .join(', ');
                sub.textContent = hasTimestamp ? cameras : `${cameras} • ${entry.files.length} file${entry.files.length > 1 ? 's' : ''}`;

                btn.appendChild(main);
                btn.appendChild(sub);
                btn.onclick = () => selectFile(index, null);
                fileListEl.appendChild(btn);

                // Child rows for individual cameras/files
                entry.files.forEach(({ file, camera }) => {
                    const child = document.createElement('button');
                    child.type = 'button';
                    child.className = 'file-item file-item-child' +
                        (index === currentFileIndex && currentCamera === (camera || file.name) ? ' active' : '');

                    const cMain = document.createElement('div');
                    cMain.className = 'file-item-main';
                    cMain.textContent = camera ? camera.toUpperCase() : 'CLIP';

                    const cSub = document.createElement('div');
                    cSub.className = 'file-item-sub';
                    cSub.textContent = file.name;

                    child.appendChild(cMain);
                    child.appendChild(cSub);
                    child.onclick = () => selectFile(index, camera || file.name);
                    fileListEl.appendChild(child);
                });
            });
        }

        function selectFile(index, cameraKey) {
            if (index < 0 || index >= loadedFiles.length) return;
            currentFileIndex = index;
            currentCamera = cameraKey || null;
            renderFileList();
            const entry = loadedFiles[index];

            // If parent row (no cameraKey) and we have multiple cameras, show grid view
            if (!cameraKey && entry.files.length > 1 && 'VideoDecoder' in window && 'EncodedVideoChunk' in window) {
                loadEventGrid(entry);
                return;
            }

            // Single file / specific camera selected
            let fileToLoad = null;
            if (cameraKey) {
                const hit = entry.files.find(f => (f.camera || f.file.name) === cameraKey);
                fileToLoad = hit?.file || entry.files[0]?.file || null;
            } else {
                // Default: prefer front camera if available, else first file
                const front = entry.files.find(f => f.camera === 'front');
                fileToLoad = (front || entry.files[0])?.file || null;
            }

            loadFile(fileToLoad);
        }

        function clearFiles() {
            loadedFiles = [];
            currentFileIndex = -1;
            currentCamera = null;
            fileListEl.innerHTML = '';
            pause();
            if (decoder) { try { decoder.close(); } catch { } decoder = null; }
            mp4 = null;
            frames = null;
            firstKeyframe = 0;
            currentFileName = null;
            currentMode = 'single';
            gridCameras = [];
            videoGrid.classList.remove('active');
            videoGrid.innerHTML = '';
            canvas.style.display = '';
            slider.max = 0;
            slider.value = 0;
            slider.disabled = true;
            playBtn.disabled = true;
            exportBtn.disabled = true;
            frameNum.textContent = 'Frame 0/0';
            fileName.textContent = 'No file loaded';
            metaList.innerHTML = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dropOverlay.classList.remove('hidden');
        }

        async function loadFile(file) {
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.mp4')) {
                alert('Please select an MP4 file');
                return;
            }
            if (!seiType) { alert('Protobuf not initialized'); return; }

            pause();
            if (decoder) { try { decoder.close(); } catch { } decoder = null; }
            metaList.innerHTML = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            try {
                currentMode = 'single';
                gridCameras = [];
                videoGrid.classList.remove('active');
                videoGrid.innerHTML = '';
                canvas.style.display = '';

                mp4 = new DashcamMP4(await file.arrayBuffer());
                frames = mp4.parseFrames(seiType);
                firstKeyframe = frames.findIndex(f => f.keyframe);
                if (firstKeyframe === -1) throw new Error('No keyframes found');

                const config = mp4.getConfig();
                currentConfig = config;
                canvas.width = config.width;
                canvas.height = config.height;
                slider.max = frames.length - 1;
                slider.value = firstKeyframe;
                dropOverlay.classList.add('hidden');
                currentFileName = file.name;
                fileName.textContent = file.name;
                exportBtn.disabled = false;
                playBtn.disabled = false;
                slider.disabled = false;
                showFrame(firstKeyframe);
                generateThumbnails().catch(() => { });
                updateGridScale();
            } catch (err) {
                mp4 = null;
                frames = null;
                firstKeyframe = 0;
                currentFileName = null;
                slider.max = 0;
                slider.value = 0;
                frameNum.textContent = 'Frame 0/0';
                fileName.textContent = 'No file loaded';
                exportBtn.disabled = true;
                playBtn.disabled = true;
                slider.disabled = true;
                dropOverlay.classList.remove('hidden');
                alert(err.message);
            }
        }

        function play() {
            if (!frames || playing) return;
            playing = true;
            playBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>';
            playNext();
        }

        function pause() {
            playing = false;
            playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>';
            if (playTimer) { clearTimeout(playTimer); playTimer = null; }
        }

        function playNext() {
            if (!playing) return;
            let next = +slider.value + 1;
            if (next >= frames.length) next = firstKeyframe;
            slider.value = next;
            showFrame(next);
            playTimer = setTimeout(playNext, mp4.getConfig().durations[next] || 33);
        }

        function showFrame(index) {
            if (!frames || !frames.length) return;
            const clamped = Math.max(0, Math.min(frames.length - 1, index));
            frameNum.textContent = `Frame ${clamped + 1}/${frames.length}`;
            renderSei(frames[clamped].sei);
            if (currentMode === 'grid') {
                // In grid mode, always render the primary camera via the main decoder (below),
                // but throttle secondary camera updates so playback stays smooth.
                const stride = playing ? 4 : 1; // when playing, update other cameras every 4th frame
                if (!playing || clamped % stride === 0 || clamped === 0 || clamped === frames.length - 1) {
                    lastGridFrameIndex = clamped;
                    renderGridFrame(clamped);
                }
            }
            if (decoding) { pendingFrame = clamped; return; }
            decodeFrame(clamped);
        }

        async function decodeFrame(index) {
            /* Naive decoding strategy: start from the preceding keyframe and decode up to the target frame.
                This is not optimal in all cases since it re-decodes frames that have already been decoded. */
            decoding = true;
            try {
                let keyIdx = index;
                while (keyIdx >= 0 && !frames[keyIdx].keyframe) keyIdx--;
                if (keyIdx < 0) { showError('No preceding keyframe'); return; }

                if (decoder) try { decoder.close(); } catch { }
                let count = 0;
                const target = index - keyIdx + 1;

                const decodePromise = new Promise((resolve, reject) => {
                    decoder = new VideoDecoder({
                        output: frame => {
                            if (++count === target) ctx.drawImage(frame, 0, 0);
                            frame.close();
                            if (count >= target) resolve();
                        },
                        error: reject
                    });

                    const config = mp4.getConfig();
                    decoder.configure({ codec: config.codec, width: config.width, height: config.height });
                    for (let i = keyIdx; i <= index; i++) decoder.decode(createChunk(frames[i]));
                    decoder.flush().catch(reject);
                });
                await decodePromise;
            } catch (err) {
                if (!err.message?.includes('Aborted')) showError('Decode failed');
            } finally {
                decoding = false;
                if (pendingFrame !== null) { const n = pendingFrame; pendingFrame = null; decodeFrame(n); }
            }
        }

        async function loadEventGrid(entry) {
            if (!entry || !entry.files.length) return;
            if (!seiType) { alert('Protobuf not initialized'); return; }

            pause();
            if (decoder) { try { decoder.close(); } catch { } decoder = null; }
            metaList.innerHTML = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            currentMode = 'grid';
            gridCameras = [];
            videoGrid.classList.add('active');
            videoGrid.innerHTML = '';
            canvas.style.display = 'none';

            try {
                // Load all cameras for this event
                const cameraResults = await Promise.all(entry.files.map(async ({ file, camera }) => {
                    const mp4Local = new DashcamMP4(await file.arrayBuffer());
                    const framesLocal = mp4Local.parseFrames(seiType);
                    const firstKey = framesLocal.findIndex(f => f.keyframe);
                    if (firstKey === -1) throw new Error(`No keyframes found in ${file.name}`);
                    const configLocal = mp4Local.getConfig();
                    return {
                        camera: camera || file.name,
                        fileName: file.name,
                        mp4: mp4Local,
                        frames: framesLocal,
                        firstKeyframe: firstKey,
                        config: configLocal
                    };
                }));

                if (!cameraResults.length) throw new Error('No playable camera clips for this event');

                // Choose primary camera (front if available)
                let primaryIndex = cameraResults.findIndex(c => c.camera === 'front');
                if (primaryIndex === -1) primaryIndex = 0;
                const primary = cameraResults[primaryIndex];

                // Use primary camera for SEI / slider / thumbnails
                mp4 = primary.mp4;
                frames = primary.frames;
                firstKeyframe = primary.firstKeyframe;
                currentFileName = primary.fileName;

                const config = primary.config;
                currentConfig = config;
                canvas.width = config.width;
                canvas.height = config.height;
                slider.max = frames.length - 1;
                slider.value = firstKeyframe;
                dropOverlay.classList.add('hidden');

                const tsLabel = formatRecordingLabel(entry);
                fileName.textContent = tsLabel || primary.fileName;
                exportBtn.disabled = false;
                playBtn.disabled = false;
                slider.disabled = false;

                // Build grid canvases (up to 4 cameras)
                gridCameras = cameraResults.slice(0, 4).map(info => {
                    const c = document.createElement('canvas');
                    c.width = info.config.width;
                    c.height = info.config.height;
                    c.title = info.camera.toUpperCase();
                    videoGrid.appendChild(c);
                    return {
                        ...info,
                        canvas: c,
                        ctx: c.getContext('2d')
                    };
                });

                showFrame(firstKeyframe);
                generateThumbnails().catch(() => { });
                updateGridScale();
            } catch (err) {
                currentMode = 'single';
                gridCameras = [];
                videoGrid.classList.remove('active');
                videoGrid.innerHTML = '';
                canvas.style.display = '';

                mp4 = null;
                frames = null;
                firstKeyframe = 0;
                currentFileName = null;
                slider.max = 0;
                slider.value = 0;
                frameNum.textContent = 'Frame 0/0';
                fileName.textContent = 'No file loaded';
                exportBtn.disabled = true;
                playBtn.disabled = true;
                slider.disabled = true;
                dropOverlay.classList.remove('hidden');
                alert(err.message);
            }
        }

        async function renderGridFrame(index) {
            if (!gridCameras.length || !('VideoDecoder' in window) || !('EncodedVideoChunk' in window)) return;

            const tasks = gridCameras.map(async info => {
                const localFrames = info.frames;
                if (!localFrames.length) return;
                const localIndex = Math.max(0, Math.min(localFrames.length - 1, index));
                try {
                    await decodeFrameToCanvasGrid(localFrames, info.mp4, localIndex, info.ctx, info.config);
                } catch {
                    // ignore per-camera decode failures
                }
            });
            await Promise.allSettled(tasks);
        }

        async function decodeFrameToCanvasGrid(localFrames, localMp4, index, targetCtx, config) {
            return new Promise((resolve, reject) => {
                let keyIdx = index;
                while (keyIdx >= 0 && !localFrames[keyIdx].keyframe) keyIdx--;
                if (keyIdx < 0) { resolve(); return; }

                let count = 0;
                const target = index - keyIdx + 1;

                const decoder = new VideoDecoder({
                    output: frame => {
                        try {
                            if (++count === target) {
                                targetCtx.drawImage(frame, 0, 0, targetCtx.canvas.width, targetCtx.canvas.height);
                            }
                        } finally {
                            frame.close();
                        }
                        if (count >= target) {
                            decoder.close();
                            resolve();
                        }
                    },
                    error: e => {
                        try { decoder.close(); } catch { }
                        reject(e);
                    }
                });

                decoder.configure({ codec: config.codec, width: config.width, height: config.height });
                for (let i = keyIdx; i <= index; i++) {
                    const frame = localFrames[i];
                    const sc = new Uint8Array([0, 0, 0, 1]);
                    const data = frame.keyframe
                        ? DashcamMP4.concat(sc, frame.sps || config.sps, sc, frame.pps || config.pps, sc, frame.data)
                        : DashcamMP4.concat(sc, frame.data);
                    const chunk = new EncodedVideoChunk({
                        type: frame.keyframe ? 'key' : 'delta',
                        timestamp: frame.index * 33333,
                        data
                    });
                    decoder.decode(chunk);
                }
                decoder.flush().catch(err => {
                    try { decoder.close(); } catch { }
                    reject(err);
                });
            });
        }

        function createChunk(frame) {
            const sc = new Uint8Array([0, 0, 0, 1]);
            const config = mp4.getConfig();
            const data = frame.keyframe
                ? DashcamMP4.concat(sc, frame.sps || config.sps, sc, frame.pps || config.pps, sc, frame.data)
                : DashcamMP4.concat(sc, frame.data);
            return new EncodedVideoChunk({ type: frame.keyframe ? 'key' : 'delta', timestamp: frame.index * 33333, data });
        }

        function renderSei(sei) {
            metaList.innerHTML = '';
            for (const { propName, label, enumMap } of seiFields) {
                const value = sei?.[propName];
                const item = document.createElement('div');
                item.className = 'item';
                const displayValue = value != null ? DashcamHelpers.formatValue(value, enumMap) : '—';
                item.innerHTML = `<span class="label">${label}</span><span class="value">${displayValue}</span>`;
                metaList.appendChild(item);
            }
        }

        async function exportCsv() {
            if (!frames || !seiFieldsCsv) return;
            const messages = frames.map(f => f.sei).filter(Boolean);
            if (!messages.length) { alert('No SEI metadata to export.'); return; }
            const filename = (currentFileName || 'dashcam').replace(/\.mp4$/i, '') + '_sei.csv';
            DashcamHelpers.downloadBlob(new Blob([DashcamHelpers.buildCsv(messages, seiFieldsCsv)], { type: 'text/csv' }), filename);
        }

        function showError(msg) {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#888';
            ctx.font = 'bold 32px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText(msg, canvas.width / 2, canvas.height / 2);
        }
    </script>
</body>
